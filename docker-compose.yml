# Local PostgreSQL for development: `docker compose up -d`, then `npm run db:migrate`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
volumes:
  pgdata:
